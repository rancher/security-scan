name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Requires yamllint, which the ci-image does not ship, so it runs on a
    # non-containerized runner.
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,run-id=${{ github.run_id }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: 'go.mod'
    - run: make validate

  test:
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.27
    needs: [ validate ]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - run: make test
    - name: Verify licenses
      run: |
        go install github.com/google/go-licenses@latest
        go-licenses check ./... --allowed_licenses=Apache-2.0,MIT,BSD-3-Clause

  test-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        # Run tests on non-Linux platforms, to ensure developers can use
        # any environment to run basic tests. These are not covered by the
        # self-hosted runners used here, so they remain on GitHub-hosted
        # runners.
        platform: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.platform }}
    needs: [ validate ]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: 'go.mod'
  
    - run: make test
    - name: Verify licenses
      run: |
        go install github.com/google/go-licenses@latest
        go-licenses check ./... --allowed_licenses=Apache-2.0,MIT,BSD-3-Clause

  e2e:
    strategy:
      fail-fast: false
      matrix:
        k8s-version: [v1.33.0, v1.34.0, v1.35.0]
    
    # Requires a Docker daemon, so it runs on a non-containerized runner.
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,run-id=${{ github.run_id }}
    needs: [ validate ]

    steps:
    - name: Setup QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: E2E Tests
      env:
        KUBERNETES_VERSION: ${{ matrix.k8s-version }}
      run: make e2e

  build-image:
    # Requires a Docker daemon, so it runs on a non-containerized runner.
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,run-id=${{ github.run_id }}
    needs: [ validate ]

    steps:
    - name: Setup QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  
    - name: Image build
      run: make test-image
